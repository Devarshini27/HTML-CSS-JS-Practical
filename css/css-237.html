<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 237 | Command Palette Shortcuts</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(850px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.palette{margin-top:28px;padding:12px;border:1px solid var(--l);border-radius:10px;background:#fff;box-shadow:0 12px 25px #112a5515}.search{padding:13px;border:1px solid var(--l);border-radius:6px;color:var(--m)}.command{display:flex;justify-content:space-between;padding:12px;color:var(--m)}kbd{padding:3px 6px;border:1px solid var(--l);border-radius:4px;background:#f0f4fa}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 237</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 237</div><h1>Command palette with shortcuts</h1><section class="palette"><div class="search">Search commands...</div><div class="command"><span>Create report</span><kbd>⌘ K</kbd></div><div class="command"><span>Open settings</span><kbd>⌘ ,</kbd></div><div class="command"><span>Invite teammate</span><kbd>⌘ I</kbd></div></section></main></body></html>
