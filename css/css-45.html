<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 45 | Pagination</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2}*{box-sizing:border-box}body{margin:0;background:#f7faff;font:14px Arial;color:#17243b}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(850px,calc(100% - 32px));margin:auto;padding:80px 0}.eyebrow{color:var(--b);font-size:12px;font-weight:bold;letter-spacing:.15em}h1{font-size:clamp(40px,8vw,75px);line-height:.95}.card{margin-top:30px;padding:25px;border:1px solid var(--l);border-radius:12px;background:#fff}.pagination{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px}.pagination a{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--l);border-radius:6px;color:#62718a;text-decoration:none}.pagination a:hover,.pagination a.active{color:#fff;border-color:var(--b);background:var(--b)}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 45</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 45</div><h1>Pagination component</h1><section class="card"><p>Pagination lets users move through a long result set one page at a time.</p><nav class="pagination" aria-label="Pagination"><a href="#previous">&lt;</a><a class="active" href="#page1">1</a><a href="#page2">2</a><a href="#page3">3</a><a href="#page4">4</a><a href="#next">&gt;</a></nav></section></main></body></html>
