<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 88 | Form Validation</title><style>:root{--n:#08295f;--b:#1257c7;--r:#c43f56;--l:#d8e3f2}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(500px,calc(100% - 32px));margin:auto;padding:80px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:42px}.form{padding:25px;border:1px solid var(--l);border-radius:12px;background:#fff}.form label{display:block;margin:13px 0 5px;font-weight:bold}.form input{width:100%;padding:11px;border:1px solid var(--l);border-radius:6px}.form input:invalid:not(:placeholder-shown){border-color:var(--r);outline:2px solid #f9d9df}.form input:valid:not(:placeholder-shown){border-color:#168866}.hint{margin-top:15px;color:#62718a;font-size:13px}.button{margin-top:18px;padding:11px 15px;border:0;border-radius:6px;color:#fff;background:var(--b);font-weight:bold}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 88</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 88</div><h1>Form validation states</h1><form class="form"><label>Email</label><input type="email" placeholder="name@example.com" required><label>Password</label><input type="password" minlength="8" placeholder="At least 8 characters" required><p class="hint">Fields use valid, invalid, required, and focus styles to make feedback visible.</p><button class="button">Submit</button></form></main></body></html>
