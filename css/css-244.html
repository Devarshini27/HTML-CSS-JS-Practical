<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 244 | Calendar Scheduling</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(900px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.calendar{margin-top:28px;padding:20px;border:1px solid var(--l);border-radius:10px;background:#fff}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:15px}.day{display:grid;place-items:center;aspect-ratio:1;border-radius:5px;color:var(--m);background:#f0f4fa}.selected{color:#fff;background:var(--b)}.event{margin-top:18px;padding:13px;border-left:4px solid var(--b);background:#eaf2ff}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 244</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 244</div><h1>SaaS calendar and scheduling</h1><section class="calendar"><h2>September 2026</h2><div class="days"><span class="day">1</span><span class="day">2</span><span class="day">3</span><span class="day">4</span><span class="day">5</span><span class="day">6</span><span class="day">7</span><span class="day">8</span><span class="day">9</span><span class="day selected">10</span><span class="day">11</span><span class="day">12</span><span class="day">13</span><span class="day">14</span></div><div class="event"><strong>Team planning</strong><br>10:00 AM · Conference room</div></section></main></body></html>
