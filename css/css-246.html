<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 246 | Collaboration Workspace</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(1050px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.workspace{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:28px}.card{padding:22px;border:1px solid var(--l);border-radius:10px;background:#fff}.message{padding:13px;margin:10px 0;border-radius:8px;background:#eaf2ff}.avatar{display:inline-grid;place-items:center;width:28px;height:28px;margin-right:8px;border-radius:50%;color:var(--b);background:#dce8ff;font-size:11px;font-weight:bold}.muted{color:var(--m)}@media(max-width:650px){.workspace{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 246</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 246</div><h1>SaaS collaboration and team workspace</h1><section class="workspace"><article class="card"><h2>Team conversation</h2><div class="message"><span class="avatar">AK</span><strong>Ananya</strong> shared the activation report.</div><div class="message"><span class="avatar">MP</span><strong>Marco</strong> added a comment.</div></article><article class="card"><h2>Shared workspace</h2><p class="muted">8 teammates · 24 shared reports · 3 active projects</p></article></section></main></body></html>
