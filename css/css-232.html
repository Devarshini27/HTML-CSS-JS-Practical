<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 232 | Dark Mode SaaS</title><style>:root{--bg:#f7faff;--surface:#fff;--text:#17243b;--blue:#1257c7;--line:#d8e3f2}body.dark{--bg:#101a33;--surface:#182645;--text:#f4f7ff;--line:#344875}*{box-sizing:border-box}body{margin:0;color:var(--text);background:var(--bg);font:14px Arial;transition:background .25s,color .25s}.nav{display:flex;justify-content:space-between;padding:16px 6vw;color:#fff;background:linear-gradient(110deg,#08295f,var(--blue))}.nav a{color:#fff;text-decoration:none}.toggle{padding:9px;border:1px solid #ffffff55;border-radius:6px;color:#fff;background:#ffffff18;cursor:pointer}.page{width:min(800px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--blue);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.card{margin-top:28px;padding:25px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 232</a><button class="toggle" onclick="document.body.classList.toggle('dark')">Toggle theme</button></nav><main class="page"><div class="eyebrow">CSS PROGRAM 232</div><h1>Dark-mode SaaS interface</h1><article class="card">CSS variables let the same components switch between light and dark surface values.</article></main></body></html>
