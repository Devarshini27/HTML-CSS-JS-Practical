<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 255 | AI Agent Management</title><style>:root{--n:#08295f;--b:#1257c7;--g:#168866;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(950px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.agents{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}.agent{padding:20px;border:1px solid var(--l);border-radius:10px;background:#fff}.status{color:var(--g);font-weight:bold}@media(max-width:650px){.agents{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 255</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 255</div><h1>AI agent management dashboard</h1><section class="agents"><article class="agent"><h2>Report agent</h2><p>Scheduled reports</p><span class="status">Running</span></article><article class="agent"><h2>Support agent</h2><p>Customer risk review</p><span class="status">Ready</span></article><article class="agent"><h2>Data agent</h2><p>Event monitoring</p><span class="status">Running</span></article></section></main></body></html>
