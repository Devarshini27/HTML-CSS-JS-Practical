<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 87 | Multi-step Form</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(600px,calc(100% - 32px));margin:auto;padding:80px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:42px}.steps{display:flex;gap:5px;margin:25px 0}.step{flex:1;height:5px;background:#dce8ff}.step.active{background:var(--b)}.form{padding:25px;border:1px solid var(--l);border-radius:12px;background:#fff}.form label{display:block;margin:13px 0 5px;font-weight:bold}.form input{width:100%;padding:11px;border:1px solid var(--l);border-radius:6px}.button{margin-top:18px;padding:11px 15px;border:0;border-radius:6px;color:#fff;background:var(--b);font-weight:bold}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 87</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 87</div><h1>Multi-step form</h1><div class="steps"><span class="step active"></span><span class="step"></span><span class="step"></span></div><form class="form"><strong>Step 1 of 3: Profile</strong><label>Name</label><input required><label>Team</label><input required><button class="button">Continue</button></form></main></body></html>
