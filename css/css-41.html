<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 41 | Mega Navigation</title><style>:root{--n:#08295f;--b:#1257c7}*{box-sizing:border-box}body{margin:0;background:#f7faff;font:14px Arial;color:#17243b}.nav{display:flex;gap:28px;padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a,.mega summary{color:#fff;text-decoration:none;cursor:pointer}.mega{position:relative}.mega summary{list-style:none}.mega[open] .panel{display:grid}.panel{position:absolute;top:30px;left:-80px;display:none;grid-template-columns:repeat(3,1fr);gap:25px;width:620px;padding:22px;border-radius:10px;background:#fff;color:#17243b;box-shadow:0 12px 30px #112a5540}.panel h3{margin:0 0 8px;color:var(--b)}.panel a{display:block;padding:6px;color:#62718a}.page{width:min(850px,calc(100% - 32px));margin:auto;padding:80px 0}h1{font-size:clamp(40px,8vw,75px);line-height:.95}.eyebrow{color:var(--b);font-size:12px;font-weight:bold;letter-spacing:.15em}.demo{margin-top:25px;padding:25px;border:1px solid #d8e3f2;border-radius:12px;background:#fff}@media(max-width:700px){.panel{position:fixed;left:16px;right:16px;width:auto;grid-template-columns:1fr}}</style></head><body><nav class="nav"><a href="#home">Northstar</a><details class="mega"><summary>Explore ▾</summary><div class="panel"><div><h3>Product</h3><a href="#analytics">Analytics</a><a href="#automation">Automation</a></div><div><h3>Resources</h3><a href="#docs">Docs</a><a href="#guides">Guides</a></div><div><h3>Company</h3><a href="#about">About</a><a href="#contact">Contact</a></div></div></details><a href="#pricing">Pricing</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 41</div><h1>Mega navigation menu</h1><div class="demo">Open Explore to view grouped links across multiple columns.</div></main></body></html>
