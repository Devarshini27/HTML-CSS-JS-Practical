<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 38 | Responsive SaaS Navigation</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--t:#17243b;--m:#62718a}*{box-sizing:border-box}body{margin:0;color:var(--t);background:#f7faff;font:14px Arial}.nav{display:flex;align-items:center;justify-content:space-between;padding:15px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.links{display:flex;gap:8px}.links a{padding:9px 12px;border-radius:6px}.links a:hover{background:#ffffff22}.menu{display:none;padding:9px;border:0;border-radius:6px;color:#fff;background:#ffffff22}.page{width:min(900px,calc(100% - 32px));margin:auto;padding:70px 0}h1{font-size:clamp(40px,8vw,75px);line-height:.95}.eyebrow{color:var(--b);font-size:12px;font-weight:bold;letter-spacing:.15em}.demo{margin-top:30px;padding:28px;border:1px solid var(--l);border-radius:12px;background:#fff;box-shadow:0 8px 22px #112a5509}.muted{color:var(--m);line-height:1.6}@media(max-width:650px){.menu{display:block}.links{display:none}.nav.open .links{position:absolute;top:62px;right:16px;display:grid;padding:8px;border-radius:8px;background:var(--n)}.nav{position:relative;flex-wrap:wrap}}</style></head><body><nav class="nav" id="nav"><strong>Northstar</strong><div class="links"><a href="#home">Home</a><a href="#reports">Reports</a><a href="#team">Team</a></div><button class="menu" onclick="nav.classList.toggle('open')">Menu</button></nav><main class="page"><div class="eyebrow">CSS PROGRAM 38</div><h1>Responsive SaaS navigation menu</h1><div class="demo"><p class="muted">Resize the viewport. The desktop links become a compact menu button on small screens.</p></div></main></body></html>
