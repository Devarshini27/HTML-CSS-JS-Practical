<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 60 | Icon and Action Buttons</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(800px,calc(100% - 32px));margin:auto;padding:80px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(40px,8vw,72px);line-height:.95}.demo{display:flex;gap:12px;align-items:center;margin-top:30px;padding:25px;border:1px solid var(--l);border-radius:12px;background:#fff}.icon,.action{border:1px solid var(--l);border-radius:7px;background:#fff;color:var(--b);cursor:pointer;font-weight:bold}.icon{width:42px;height:42px;font-size:20px}.action{padding:11px 15px}.icon:hover,.action:hover{background:#eaf2ff}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 60</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 60</div><h1>Icon and action buttons</h1><div class="demo"><button class="icon" title="Search" aria-label="Search">⌕</button><button class="icon" title="Notifications" aria-label="Notifications">♢</button><button class="action">Export report</button><button class="action">Invite team</button></div></main></body></html>
