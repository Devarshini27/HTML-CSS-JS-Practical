<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 162 | Multi-Agent Workflow</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(1050px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.workflow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}.agent{padding:20px;border:1px solid var(--l);border-radius:10px;background:#fff}.agent h2{color:var(--b)}.agent p{color:var(--m);line-height:1.5}.handoff{padding:8px 0;color:var(--b);font-weight:bold}@media(max-width:650px){.workflow{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 162</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 162</div><h1>Multi-agent workflow management</h1><section class="workflow"><article class="agent"><h2>Research agent</h2><p>Collects the latest workspace signals.</p><div class="handoff">→ Data agent</div></article><article class="agent"><h2>Data agent</h2><p>Transforms signals into structured findings.</p><div class="handoff">→ Report agent</div></article><article class="agent"><h2>Report agent</h2><p>Prepares a reviewable summary for the team.</p></article></section></main></body></html>
