<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 164 | Trigger and Action Workflow</title><style>:root{--n:#08295f;--b:#1257c7;--g:#168866;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(850px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.workflow{margin-top:28px;padding:22px;border:1px solid var(--l);border-radius:10px;background:#fff}.row{display:flex;align-items:center;gap:12px;margin:12px 0}.label{width:80px;color:var(--m);font-size:12px;font-weight:bold}.box{flex:1;padding:13px;border-radius:7px;background:#eaf2ff}.trigger{border-left:4px solid var(--b)}.action{border-left:4px solid var(--g)}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 164</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 164</div><h1>Trigger and action workflow</h1><section class="workflow"><div class="row"><span class="label">WHEN</span><div class="box trigger">A customer submits a feedback form</div></div><div class="row"><span class="label">THEN</span><div class="box action">Create a task for the success team</div></div><div class="row"><span class="label">THEN</span><div class="box action">Send a confirmation email</div></div></section></main></body></html>
