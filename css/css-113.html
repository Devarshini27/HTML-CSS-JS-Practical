<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 113 | Customizable Dashboard Widgets</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(1050px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.widgets{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}.widget{min-height:130px;padding:18px;border:1px solid var(--l);border-radius:10px;background:#fff;cursor:grab}.widget:active{cursor:grabbing}.widget.wide{grid-column:span 2}.muted{color:var(--m)}@media(max-width:650px){.widgets{grid-template-columns:1fr}.widget.wide{grid-column:auto}}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 113</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 113</div><h1>Customizable dashboard widgets</h1><section class="widgets"><article class="widget wide" draggable="true"><h2>Revenue trend</h2><p class="muted">Drag this widget to rearrange the workspace.</p></article><article class="widget" draggable="true"><h2>Active users</h2><strong>12.4k</strong></article><article class="widget" draggable="true"><h2>Tasks</h2><strong>86%</strong></article></section></main></body></html>
