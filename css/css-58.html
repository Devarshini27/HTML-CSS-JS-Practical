<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 58 | SaaS Landing Header</title><style>:root{--n:#08295f;--b:#1257c7}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{display:flex;justify-content:space-between;align-items:center;padding:17px 6vw;background:#fff;border-bottom:1px solid #d8e3f2}.nav a{color:#1257c7;text-decoration:none}.links{display:flex;gap:20px}.header{width:min(1050px,calc(100% - 32px));margin:auto;padding:100px 0 80px}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}.header h1{max-width:700px;font-size:clamp(42px,8vw,78px);line-height:.95}.header p{max-width:600px;color:#62718a;font-size:18px;line-height:1.6}.button{display:inline-block;padding:12px 16px;border-radius:7px;color:#fff;background:var(--b);text-decoration:none;font-weight:bold}.links a:hover{color:var(--b)}@media(max-width:600px){.links{display:none}}</style></head><body><header class="nav"><strong>Northstar</strong><nav class="links"><a href="#product">Product</a><a href="#pricing">Pricing</a><a href="#docs">Docs</a></nav><a class="button" href="#login">Sign in</a></header><main class="header"><div class="eyebrow">CSS PROGRAM 58</div><h1>A landing page header built for clarity.</h1><p>Logo, navigation, authentication action, and product message form a balanced SaaS opening.</p><a class="button" href="#demo">View demo</a></main></body></html>
