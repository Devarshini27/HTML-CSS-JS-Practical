<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 53 | Dashboard Card</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;font:14px Arial;color:#17243b}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(850px,calc(100% - 32px));margin:auto;padding:80px 0}.eyebrow{color:var(--b);font-size:12px;font-weight:bold;letter-spacing:.15em}h1{font-size:clamp(40px,8vw,72px);line-height:.95}.dashboard{margin-top:30px;padding:22px;border:1px solid var(--l);border-radius:12px;background:#fff}.head{display:flex;justify-content:space-between}.chart{display:flex;align-items:end;gap:9px;height:150px;padding-top:20px}.bar{flex:1;height:var(--h);border-radius:5px 5px 0 0;background:#9eb8ff}.bar:nth-child(2n){background:var(--b)}.muted{color:var(--m)}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 53</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 53</div><h1>Dashboard card</h1><article class="dashboard"><div class="head"><h2>Weekly usage</h2><span class="muted">Last 7 days</span></div><div class="chart"><span class="bar" style="--h:35%"></span><span class="bar" style="--h:62%"></span><span class="bar" style="--h:48%"></span><span class="bar" style="--h:76%"></span><span class="bar" style="--h:58%"></span><span class="bar" style="--h:92%"></span></div></article></main></body></html>
