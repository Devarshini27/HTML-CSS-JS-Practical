<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 118 | AI Chat Sidebar</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.layout{display:grid;grid-template-columns:1fr 300px;min-height:100vh}.main{padding:70px 6vw}.sidebar{padding:24px;color:#fff;background:var(--n)}.eyebrow{color:#9fc5ff;font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.chat{margin-top:25px;padding:16px;border-radius:10px;background:#17417f}.chat input{width:100%;padding:11px;border:0;border-radius:6px}.bubble{margin:12px 0;padding:11px;border-radius:7px;background:#fff;color:#17243b}.muted{color:#cbd9ed;line-height:1.5}@media(max-width:700px){.layout{grid-template-columns:1fr}.sidebar{order:-1}}</style></head><body><div class="layout"><main class="main"><div class="eyebrow">CSS PROGRAM 118</div><h1>AI chat sidebar</h1><p>Keep an assistant available beside the primary workspace without obscuring the main task.</p></main><aside class="sidebar"><h2>Copilot</h2><p class="muted">Ask about this dashboard or select a suggestion.</p><div class="chat"><div class="bubble">Explain the revenue trend</div><div class="bubble">Find unusual activity</div><input placeholder="Ask Copilot"></div></aside></div></body></html>
