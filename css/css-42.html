<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 42 | Breadcrumb Navigation</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2}*{box-sizing:border-box}body{margin:0;background:#f7faff;font:14px Arial;color:#17243b}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(900px,calc(100% - 32px));margin:auto;padding:80px 0}.eyebrow{color:var(--b);font-size:12px;font-weight:bold;letter-spacing:.15em}h1{font-size:clamp(40px,8vw,75px);line-height:.95}.crumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px;padding:15px;border:1px solid var(--l);border-radius:8px;background:#fff}.crumbs a{color:var(--b);text-decoration:none}.crumbs span{color:#8a98ad}.card{margin-top:18px;padding:24px;border:1px solid var(--l);border-radius:12px;background:#fff;color:#62718a}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 42</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 42</div><h1>Breadcrumb navigation</h1><nav class="crumbs" aria-label="Breadcrumb"><a href="#home">Home</a><span>/</span><a href="#workspace">Workspace</a><span>/</span><a href="#reports">Reports</a><span>/</span><strong>Monthly report</strong></nav><div class="card">Breadcrumbs show the current location and provide a quick path back to parent pages.</div></main></body></html>
