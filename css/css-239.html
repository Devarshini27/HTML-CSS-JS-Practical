<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 239 | User Profile Menu</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{display:flex;justify-content:space-between;padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.profile{position:relative}.avatar{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;color:var(--b);background:#dce8ff;font-weight:bold;cursor:pointer}.menu{display:none;position:absolute;right:0;top:46px;width:210px;padding:9px;border:1px solid var(--l);border-radius:9px;background:#fff;box-shadow:0 10px 25px #112a5522}.profile:focus-within .menu{display:block}.menu a{display:block;padding:10px;color:var(--m);text-decoration:none}.menu a:hover{color:var(--b);background:#eaf2ff}.page{width:min(800px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}</style></head><body><nav class="nav"><a href="index.html">Northstar</a><div class="profile"><button class="avatar" aria-label="Open profile menu">DL</button><div class="menu"><strong>Devarshini</strong><a href="#profile">Profile settings</a><a href="#billing">Billing</a><a href="#logout">Sign out</a></div></div></nav><main class="page"><div class="eyebrow">CSS PROGRAM 239</div><h1>SaaS user profile menu</h1><p>Focus the avatar to reveal account actions.</p></main></body></html>
