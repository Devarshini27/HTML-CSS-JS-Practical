<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 169 | ML Risk Score Dashboard</title><style>:root{--n:#08295f;--b:#1257c7;--r:#c43f56;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(1000px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}.card{padding:20px;border:1px solid var(--l);border-radius:10px;background:#fff}.value{font-size:30px;font-weight:bold}.high{color:var(--r)}.muted{color:var(--m)}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 169</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 169</div><h1>ML risk score dashboard</h1><section class="grid"><article class="card"><span class="muted">Account risk</span><div class="value high">72</div><p class="muted">High risk</p></article><article class="card"><span class="muted">Data quality risk</span><div class="value">18</div><p class="muted">Low risk</p></article><article class="card"><span class="muted">Model drift</span><div class="value">24</div><p class="muted">Watch</p></article></section></main></body></html>
