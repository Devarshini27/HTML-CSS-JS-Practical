<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 224 | Sticky SaaS Header</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.header{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;padding:17px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b));box-shadow:0 5px 18px #08295f33}.header a{color:#fff;text-decoration:none}.page{width:min(800px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,8vw,70px);line-height:.95}.section{min-height:340px;margin:20px 0;padding:25px;border:1px solid var(--l);border-radius:10px;background:#fff}</style></head><body><header class="header"><strong>Northstar</strong><nav><a href="#reports">Reports</a> <a href="#team">Team</a></nav></header><main class="page"><div class="eyebrow">CSS PROGRAM 224</div><h1>Sticky SaaS header</h1><section class="section">Scroll the page: the header stays available while content moves underneath.</section><section class="section">A sticky header supports repeated navigation in long workspaces.</section></main></body></html>
