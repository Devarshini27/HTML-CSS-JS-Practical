<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 85 | Registration Form</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(600px,calc(100% - 32px));margin:auto;padding:80px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:42px}.form{padding:25px;border:1px solid var(--l);border-radius:12px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{display:block;margin:13px 0 5px;font-weight:bold}.form input,.form select{width:100%;padding:11px;border:1px solid var(--l);border-radius:6px}.button{margin-top:18px;padding:11px 15px;border:0;border-radius:6px;color:#fff;background:var(--b);font-weight:bold}@media(max-width:550px){.grid{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 85</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 85</div><h1>Registration form</h1><form class="form"><div class="grid"><div><label>First name</label><input required></div><div><label>Last name</label><input required></div><div><label>Email</label><input type="email" required></div><div><label>Role</label><select><option>Member</option><option>Manager</option></select></div></div><button class="button">Register</button></form></main></body></html>
