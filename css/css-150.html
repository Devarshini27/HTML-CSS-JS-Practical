<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 150 | AI Agent Task Queue</title><style>:root{--n:#08295f;--b:#1257c7;--g:#168866;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(950px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.queue{margin-top:28px;padding:10px;border:1px solid var(--l);border-radius:10px;background:#fff}.task{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:15px;border-bottom:1px solid var(--l)}.task:last-child{border:0}.num{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;background:var(--b)}.muted{color:var(--m)}.tag{padding:5px 8px;border-radius:99px;color:var(--g);background:#e7f8f0;font-size:12px;font-weight:bold}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 150</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 150</div><h1>AI agent task queue</h1><section class="queue"><div class="task"><span class="num">1</span><div><strong>Generate weekly report</strong><br><span class="muted">Report agent</span></div><span class="tag">Running</span></div><div class="task"><span class="num">2</span><div><strong>Review churn accounts</strong><br><span class="muted">Support agent</span></div><span class="tag">Queued</span></div></section></main></body></html>
