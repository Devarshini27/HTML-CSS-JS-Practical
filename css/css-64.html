<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 64 | Alert Notification</title><style>:root{--n:#08295f;--b:#1257c7;--g:#168866;--r:#c43f56;--l:#d8e3f2}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(800px,calc(100% - 32px));margin:auto;padding:80px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(40px,8vw,72px);line-height:.95}.alerts{display:grid;gap:12px;margin-top:30px}.alert{padding:15px 18px;border-left:5px solid;border-radius:8px;background:#fff}.info{border-color:var(--b);background:#eaf2ff}.success{border-color:var(--g);background:#e7f8f0}.error{border-color:var(--r);background:#ffedf0}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 64</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 64</div><h1>Alert and notification components</h1><section class="alerts"><div class="alert info"><strong>Information</strong><br>Reports refresh every five minutes.</div><div class="alert success"><strong>Success</strong><br>Your export is ready.</div><div class="alert error"><strong>Action needed</strong><br>Review your billing details.</div></section></main></body></html>
