<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 186 | User Management</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(1000px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.toolbar{display:flex;gap:10px;margin-top:28px}.toolbar input{flex:1;padding:10px;border:1px solid var(--l);border-radius:6px}.button{padding:10px 14px;border:0;border-radius:6px;color:#fff;background:var(--b);font-weight:bold}.users{margin-top:15px;display:grid;gap:8px}.user{display:flex;justify-content:space-between;padding:16px;border:1px solid var(--l);border-radius:8px;background:#fff}.muted{color:var(--m)}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 186</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 186</div><h1>User management</h1><div class="toolbar"><input placeholder="Search users"><button class="button">Add user</button></div><section class="users"><div class="user"><span><strong>Ananya Kapoor</strong><br><span class="muted">ananya@example.com</span></span><span>Admin</span></div><div class="user"><span><strong>Marco Polo</strong><br><span class="muted">marco@example.com</span></span><span>Member</span></div></section></main></body></html>
