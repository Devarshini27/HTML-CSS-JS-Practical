<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 218 | Responsive Charts</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(1000px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px}.chart{height:220px;padding:20px;border:1px solid var(--l);border-radius:10px;background:#fff}.bars{display:flex;align-items:end;gap:7px;height:150px}.bar{flex:1;height:var(--h);background:var(--b);border-radius:4px 4px 0 0}.muted{color:var(--m)}@media(max-width:650px){.charts{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 218</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 218</div><h1>Responsive charts and data visualization</h1><section class="charts"><article class="chart"><h2>Revenue</h2><div class="bars"><span class="bar" style="--h:40%"></span><span class="bar" style="--h:65%"></span><span class="bar" style="--h:82%"></span></div></article><article class="chart"><h2>Usage</h2><div class="bars"><span class="bar" style="--h:58%"></span><span class="bar" style="--h:48%"></span><span class="bar" style="--h:92%"></span></div></article></section></main></body></html>
