<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 240 | SaaS Onboarding</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;margin:0;background:#f7faff;color:#17243b;font:14px Arial}.onboard{width:min(650px,calc(100% - 32px));padding:28px;border:1px solid var(--l);border-radius:12px;background:#fff}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:42px}.progress{display:flex;gap:5px;margin:20px 0}.step{flex:1;height:5px;background:#dce8ff}.active{background:var(--b)}.button{margin-top:18px;padding:11px 15px;border:0;border-radius:6px;color:#fff;background:var(--b);font-weight:bold}.muted{color:var(--m);line-height:1.5}</style></head><body><main class="onboard"><div class="eyebrow">CSS PROGRAM 240</div><h1>SaaS onboarding workflow</h1><div class="progress"><span class="step active"></span><span class="step active"></span><span class="step"></span><span class="step"></span></div><h2>Tell us about your team</h2><p class="muted">This helps personalize your first dashboard and recommendations.</p><button class="button">Continue</button></main></body></html>
