<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 250 | SaaS Signup Page</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2}*{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;margin:0;background:#f7faff;font:14px Arial;color:#17243b}.signup{width:min(500px,calc(100% - 32px));padding:28px;border:1px solid var(--l);border-radius:12px;background:#fff}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}.signup h1{font-size:38px}.row{display:flex;gap:10px}.field{flex:1}.signup label{display:block;margin:13px 0 5px;font-weight:bold}.signup input{width:100%;padding:11px;border:1px solid var(--l);border-radius:6px}.button{margin-top:18px;padding:11px 15px;border:0;border-radius:6px;color:#fff;background:var(--b);font-weight:bold}@media(max-width:500px){.row{flex-direction:column}}</style></head><body><main class="signup"><div class="eyebrow">CSS PROGRAM 250</div><h1>Create your workspace</h1><form><div class="row"><div class="field"><label>First name</label><input required></div><div class="field"><label>Last name</label><input required></div></div><label>Work email</label><input type="email" required><button class="button">Start free trial</button></form></main></body></html>
