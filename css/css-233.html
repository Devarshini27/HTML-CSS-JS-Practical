<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 233 | Theme Switcher</title><style>:root{--bg:#f7faff;--surface:#fff;--text:#17243b;--blue:#1257c7;--line:#d8e3f2}body:has(#theme:checked){--bg:#101a33;--surface:#182645;--text:#f4f7ff;--line:#344875}*{box-sizing:border-box}body{margin:0;color:var(--text);background:var(--bg);font:14px Arial;transition:.25s}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,#08295f,var(--blue))}.nav a{color:#fff;text-decoration:none}.switch{padding:9px 12px;border-radius:6px;color:#fff;background:#ffffff22;cursor:pointer}.page{width:min(800px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--blue);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.card{margin-top:28px;padding:25px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}#theme{position:absolute;opacity:0}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 233</a><label class="switch" for="theme">Light / dark</label><input id="theme" type="checkbox"></nav><main class="page"><div class="eyebrow">CSS PROGRAM 233</div><h1>Light and dark theme switcher</h1><article class="card">The checked state changes custom properties through the CSS cascade.</article></main></body></html>
