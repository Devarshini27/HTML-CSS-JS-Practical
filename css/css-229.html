<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 229 | Animated SaaS Cards</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(900px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}.card{padding:22px;border:1px solid var(--l);border-radius:10px;background:#fff;animation:rise .7s both}.card:nth-child(2){animation-delay:.15s}.card:nth-child(3){animation-delay:.3s}@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@media(max-width:650px){.cards{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 229</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 229</div><h1>Animated SaaS cards</h1><section class="cards"><article class="card"><h2>Revenue</h2><strong>$84k</strong></article><article class="card"><h2>Users</h2><strong>12.4k</strong></article><article class="card"><h2>Retention</h2><strong>91%</strong></article></section></main></body></html>
