<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 216 | Responsive SaaS Form</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(700px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.form{margin-top:28px;padding:22px;border:1px solid var(--l);border-radius:10px;background:#fff}.row{display:flex;gap:12px}.field{flex:1}.form label{display:block;margin:13px 0 6px;font-weight:bold}.form input,.form select,.form textarea{width:100%;padding:10px;border:1px solid var(--l);border-radius:6px;font:inherit}.form textarea{min-height:100px}.button{margin-top:16px;padding:10px 14px;border:0;border-radius:6px;color:#fff;background:var(--b);font-weight:bold}@media(max-width:550px){.row{flex-direction:column}}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 216</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 216</div><h1>Responsive SaaS form</h1><form class="form"><div class="row"><div class="field"><label>Name</label><input required></div><div class="field"><label>Email</label><input type="email" required></div></div><label>Message</label><textarea></textarea><button class="button">Submit request</button></form></main></body></html>
