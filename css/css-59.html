<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 59 | Button Variants</title><style>:root{--n:#08295f;--b:#1257c7;--r:#c43f56;--l:#d8e3f2}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(800px,calc(100% - 32px));margin:auto;padding:80px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(40px,8vw,72px);line-height:.95}.demo{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px;padding:25px;border:1px solid var(--l);border-radius:12px;background:#fff}.btn{padding:11px 15px;border-radius:7px;font:inherit;font-weight:bold;cursor:pointer}.primary{border:1px solid var(--b);color:#fff;background:var(--b)}.secondary{border:1px solid #9eb8ff;color:var(--b);background:#eaf2ff}.outline{border:1px solid var(--b);color:var(--b);background:#fff}.destructive{border:1px solid var(--r);color:#fff;background:var(--r)}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 59</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 59</div><h1>Button variants</h1><div class="demo"><button class="btn primary">Primary</button><button class="btn secondary">Secondary</button><button class="btn outline">Outline</button><button class="btn destructive">Destructive</button></div></main></body></html>
