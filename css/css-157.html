<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 157 | Agent Permissions</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(800px,calc(100% - 32px));margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.permissions{margin-top:28px;padding:22px;border:1px solid var(--l);border-radius:10px;background:#fff}.permission{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--l)}.permission:last-child{border:0}.permission input{accent-color:var(--b)}.muted{color:var(--m)}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 157</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 157</div><h1>AI agent permissions management</h1><section class="permissions"><div class="permission"><span>Read workspace analytics</span><input type="checkbox" checked></div><div class="permission"><span>Create reports</span><input type="checkbox" checked></div><div class="permission"><span>Publish externally</span><input type="checkbox"></div><div class="permission"><span>Manage other agents</span><input type="checkbox"></div><p class="muted">Permissions limit what an agent can view and change.</p></section></main></body></html>
