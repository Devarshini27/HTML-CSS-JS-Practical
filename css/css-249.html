<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 249 | SaaS Login Page</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2}*{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;margin:0;background:linear-gradient(135deg,#eaf2ff,#f7faff);font:14px Arial;color:#17243b}.login{width:min(430px,calc(100% - 32px));padding:28px;border:1px solid var(--l);border-radius:12px;background:#fff}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}.login h1{font-size:38px}.login label{display:block;margin:13px 0 5px;font-weight:bold}.login input{width:100%;padding:11px;border:1px solid var(--l);border-radius:6px}.button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:6px;color:#fff;background:var(--b);font-weight:bold}.muted{color:#62718a}</style></head><body><main class="login"><div class="eyebrow">CSS PROGRAM 249</div><h1>Welcome back</h1><form><label>Email</label><input type="email" required><label>Password</label><input type="password" required><button class="button">Sign in</button></form><p class="muted">Forgot password? Reset access securely.</p></main></body></html>
