<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 43 | Tab Navigation</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2}*{box-sizing:border-box}body{margin:0;background:#f7faff;font:14px Arial;color:#17243b}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(850px,calc(100% - 32px));margin:auto;padding:80px 0}.eyebrow{color:var(--b);font-size:12px;font-weight:bold;letter-spacing:.15em}h1{font-size:clamp(40px,8vw,75px);line-height:.95}.tabs{display:flex;gap:20px;margin-top:30px;border-bottom:1px solid var(--l)}.tabs a{padding:12px 2px;color:#62718a;text-decoration:none}.tabs a:hover,.tabs a.active{border-bottom:2px solid var(--b);color:var(--b);font-weight:bold}.panel{padding:24px;border:1px solid var(--l);border-top:0;border-radius:0 0 10px 10px;background:#fff;color:#62718a}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 43</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 43</div><h1>Tab navigation</h1><nav class="tabs"><a class="active" href="#overview">Overview</a><a href="#activity">Activity</a><a href="#settings">Settings</a></nav><section class="panel" id="overview">The active tab uses color and a bottom border to show the selected view.</section></main></body></html>
