<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 122 | AI Prompt Input</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(850px,calc(100% - 32px));margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.prompt{margin-top:28px;padding:16px;border:1px solid var(--l);border-radius:10px;background:#fff}.prompt textarea{width:100%;min-height:120px;border:0;outline:0;resize:vertical;font:15px Arial}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--m);font-size:12px}.button{padding:10px 14px;border:0;border-radius:6px;color:#fff;background:var(--b);font-weight:bold}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 122</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 122</div><h1>AI prompt input</h1><form class="prompt"><textarea placeholder="Describe the report or insight you want to create..."></textarea><div class="footer"><span>Supports natural-language requests</span><button class="button">Generate</button></div></form></main></body></html>
