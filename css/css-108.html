<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 108 | Pie and Donut Charts</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(900px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.charts{display:flex;justify-content:center;gap:45px;flex-wrap:wrap;margin-top:30px;padding:28px;border:1px solid var(--l);border-radius:10px;background:#fff}.pie,.donut{width:180px;height:180px;border-radius:50%;background:conic-gradient(var(--b) 0 45%,#75a0f3 45% 75%,#dce8ff 75%)}.donut{display:grid;place-items:center;background:conic-gradient(var(--b) 0 68%,#dce8ff 68%)}.donut:after{content:"68%";display:grid;place-items:center;width:105px;height:105px;border-radius:50%;background:#fff;font-weight:bold;color:var(--b)}.muted{color:var(--m);text-align:center}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 108</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 108</div><h1>Pie and donut chart analytics</h1><section class="charts"><div><div class="pie"></div><p class="muted">Plan mix</p></div><div><div class="donut"></div><p class="muted">Retention</p></div></section></main></body></html>
