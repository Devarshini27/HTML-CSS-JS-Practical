<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 137 | Text to Chart</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(950px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.work{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px}.prompt,.chart{padding:22px;border:1px solid var(--l);border-radius:10px;background:#fff}.prompt p{padding:12px;border-radius:7px;background:#eaf2ff;color:var(--m)}.chartbox{height:170px;display:flex;align-items:end;gap:8px}.bar{flex:1;height:var(--h);background:var(--b);border-radius:4px 4px 0 0}@media(max-width:650px){.work{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 137</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 137</div><h1>Text-to-chart analytics</h1><section class="work"><article class="prompt"><h2>Prompt</h2><p>Show monthly revenue for the first half of the year.</p><button>Generate chart</button></article><article class="chart"><h2>Generated chart</h2><div class="chartbox"><span class="bar" style="--h:38%"></span><span class="bar" style="--h:52%"></span><span class="bar" style="--h:64%"></span><span class="bar" style="--h:75%"></span><span class="bar" style="--h:88%"></span></div></article></section></main></body></html>
