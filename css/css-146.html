<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 146 | AI Agent Dashboard</title><style>:root{--n:#08295f;--b:#1257c7;--g:#168866;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(1050px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}.agent{padding:20px;border:1px solid var(--l);border-radius:10px;background:#fff}.status{display:inline-block;margin-top:12px;padding:5px 8px;border-radius:99px;color:var(--g);background:#e7f8f0;font-size:12px;font-weight:bold}.muted{color:var(--m)}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 146</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 146</div><h1>AI agent dashboard</h1><section class="grid"><article class="agent"><h2>Report agent</h2><p class="muted">Generates weekly reports.</p><span class="status">Running</span></article><article class="agent"><h2>Support agent</h2><p class="muted">Reviews account risks.</p><span class="status">Ready</span></article><article class="agent"><h2>Data agent</h2><p class="muted">Monitors incoming events.</p><span class="status">Running</span></article></section></main></body></html>
