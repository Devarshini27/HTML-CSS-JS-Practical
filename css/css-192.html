<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 192 | Webhook Management</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(900px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.hook{margin-top:28px;padding:20px;border:1px solid var(--l);border-radius:10px;background:#fff}.endpoint{padding:11px;border-radius:6px;color:var(--m);background:#f0f4fa;font-family:monospace;word-break:break-all}.events{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.event{padding:7px 9px;border-radius:99px;color:var(--b);background:#eaf2ff;font-size:12px}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 192</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 192</div><h1>Webhook management</h1><article class="hook"><h2>Production webhook</h2><div class="endpoint">https://api.example.com/hooks/northstar</div><div class="events"><span class="event">report.created</span><span class="event">user.created</span><span class="event">alert.triggered</span></div></article></main></body></html>
