<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 65 | Toast Notification</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(800px,calc(100% - 32px));margin:auto;padding:80px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(40px,8vw,72px);line-height:.95}.toast{display:flex;justify-content:space-between;gap:20px;margin-top:30px;padding:15px 18px;border:1px solid var(--l);border-radius:8px;background:#fff;box-shadow:0 10px 25px #112a5522}.toast button{border:0;background:none;color:#62718a;cursor:pointer}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 65</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 65</div><h1>Toast notification</h1><div class="toast" id="toast"><span><strong>Saved</strong><br>Your report is ready to view.</span><button onclick="toast.hidden=true">Dismiss</button></div></main></body></html>
