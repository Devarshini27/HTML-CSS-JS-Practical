<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 111 | Date Range Filter</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(800px,calc(100% - 32px));margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.filter{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-top:28px;padding:22px;border:1px solid var(--l);border-radius:10px;background:#fff}.field label{display:block;margin-bottom:6px;font-weight:bold}.field input{padding:10px;border:1px solid var(--l);border-radius:6px}.button{padding:10px 14px;border:0;border-radius:6px;color:#fff;background:var(--b);font-weight:bold}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 111</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 111</div><h1>Analytics date-range filter</h1><form class="filter"><div class="field"><label for="start">Start date</label><input id="start" type="date"></div><div class="field"><label for="end">End date</label><input id="end" type="date"></div><button class="button">Apply filter</button></form></main></body></html>
