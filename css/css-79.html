<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 79 | Progress Stepper</title><style>:root{--n:#08295f;--b:#1257c7;--g:#168866;--l:#d8e3f2}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(850px,calc(100% - 32px));margin:auto;padding:80px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(40px,8vw,72px);line-height:.95}.steps{display:flex;margin-top:30px}.step{position:relative;flex:1;text-align:center}.step:after{content:"";position:absolute;top:16px;left:50%;width:100%;height:3px;background:#dce8ff}.step:last-child:after{display:none}.dot{position:relative;z-index:1;display:grid;place-items:center;width:34px;height:34px;margin:auto;border-radius:50%;color:#fff;background:#b7c9e7}.done .dot,.current .dot{background:var(--b)}.step span{display:block;margin-top:8px;font-size:12px}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 79</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 79</div><h1>Progress stepper</h1><div class="steps"><div class="step done"><div class="dot">✓</div><span>Details</span></div><div class="step current"><div class="dot">2</div><span>Review</span></div><div class="step"><div class="dot">3</div><span>Publish</span></div></div></main></body></html>
