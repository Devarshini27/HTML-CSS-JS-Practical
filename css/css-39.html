<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 39 | Mobile Sidebar Drawer</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2}*{box-sizing:border-box}body{margin:0;background:#f7faff;font:14px Arial;color:#17243b}.top{display:flex;justify-content:space-between;padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.top button{padding:9px;border:0;border-radius:6px;color:#fff;background:#ffffff22}.drawer{position:fixed;inset:0 auto 0 0;z-index:2;width:260px;padding:25px;color:#fff;background:var(--n);transform:translateX(-100%);transition:transform .25s}.drawer.open{transform:translateX(0)}.drawer a{display:block;padding:12px;color:#cbd9ed;text-decoration:none}.drawer a:hover{color:#fff;background:#17417f}.page{width:min(800px,calc(100% - 32px));margin:auto;padding:80px 0}h1{font-size:clamp(38px,8vw,72px);line-height:.95}.demo{margin-top:25px;padding:25px;border:1px solid var(--l);border-radius:12px;background:#fff}.close{float:right}button{cursor:pointer}</style></head><body><header class="top"><strong>Northstar Mobile</strong><button onclick="drawer.classList.toggle('open')">Open drawer</button></header><aside class="drawer" id="drawer"><button class="close" onclick="drawer.classList.remove('open')">Close</button><h2>Workspace</h2><a href="#dashboard">Dashboard</a><a href="#reports">Reports</a><a href="#settings">Settings</a></aside><main class="page"><div class="eyebrow">CSS PROGRAM 39</div><h1>Mobile sidebar navigation drawer</h1><div class="demo">Tap Open drawer to reveal the mobile navigation.</div></main><script>const drawer=document.getElementById('drawer');</script></body></html>
