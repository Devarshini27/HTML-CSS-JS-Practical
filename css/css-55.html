<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 55 | Activity Feed Card</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;font:14px Arial;color:#17243b}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(750px,calc(100% - 32px));margin:auto;padding:80px 0}.eyebrow{color:var(--b);font-size:12px;font-weight:bold;letter-spacing:.15em}h1{font-size:clamp(40px,8vw,72px);line-height:.95}.feed{margin-top:30px;padding:20px;border:1px solid var(--l);border-radius:12px;background:#fff}.item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--l)}.item:last-child{border:0}.avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;color:var(--b);background:#dce8ff;font-size:11px;font-weight:bold}.muted{color:var(--m);font-size:13px}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 55</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 55</div><h1>Activity feed card</h1><section class="feed"><div class="item"><span class="avatar">MP</span><div><strong>Marco shared a report</strong><div class="muted">8 minutes ago</div></div></div><div class="item"><span class="avatar">SY</span><div><strong>System synced data</strong><div class="muted">1 hour ago</div></div></div></section></main></body></html>
