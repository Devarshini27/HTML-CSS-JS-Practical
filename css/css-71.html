<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 71 | Command Palette</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(800px,calc(100% - 32px));margin:auto;padding:80px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(40px,8vw,72px);line-height:.95}.palette{margin-top:30px;padding:18px;border:1px solid var(--l);border-radius:10px;background:#fff;box-shadow:0 10px 25px #112a5515}.palette input{width:100%;padding:12px;border:1px solid var(--l);border-radius:6px}.palette a{display:block;padding:11px;color:var(--m);text-decoration:none}.palette a:hover{color:var(--b);background:#eaf2ff}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 71</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 71</div><h1>Command palette</h1><section class="palette"><input placeholder="Search commands"><a href="#new">Create new report</a><a href="#invite">Invite teammate</a><a href="#settings">Open settings</a></section></main></body></html>
