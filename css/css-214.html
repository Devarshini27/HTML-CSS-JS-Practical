<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 214 | Responsive Data Table</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(1000px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.table{margin-top:28px;overflow-x:auto;border:1px solid var(--l);border-radius:10px;background:#fff}table{width:100%;min-width:620px;border-collapse:collapse}th,td{padding:14px;text-align:left;border-bottom:1px solid var(--l)}th{color:var(--m);font-size:12px}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 214</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 214</div><h1>Responsive data table</h1><section class="table"><table><tr><th>PROJECT</th><th>OWNER</th><th>STATUS</th><th>UPDATED</th></tr><tr><td>Onboarding</td><td>Ananya</td><td>Active</td><td>Today</td></tr><tr><td>Retention</td><td>Marco</td><td>Review</td><td>Yesterday</td></tr></table></section></main></body></html>
