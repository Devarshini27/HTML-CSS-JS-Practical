<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 112 | Analytics Filter Panel</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(850px,calc(100% - 32px));margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.panel{margin-top:28px;padding:22px;border:1px solid var(--l);border-radius:10px;background:#fff}.row{display:flex;gap:20px;flex-wrap:wrap}.panel label{display:block;margin:12px 0 6px;font-weight:bold}.panel select{min-width:180px;padding:10px;border:1px solid var(--l);border-radius:6px}.button{margin-top:18px;padding:10px 14px;border:0;border-radius:6px;color:#fff;background:var(--b);font-weight:bold}.muted{color:var(--m)}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 112</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 112</div><h1>Analytics filter and sorting panel</h1><section class="panel"><div class="row"><div><label>Team</label><select><option>All teams</option><option>Design</option><option>Engineering</option></select></div><div><label>Sort by</label><select><option>Newest first</option><option>Highest value</option></select></div></div><button class="button">Apply filters</button><p class="muted">Filters and sorting controls are grouped for quick scanning.</p></section></main></body></html>
