<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 149 | Agent Status Monitoring</title><style>:root{--n:#08295f;--b:#1257c7;--g:#168866;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(950px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}.card{padding:20px;border:1px solid var(--l);border-radius:10px;background:#fff}.dot{display:inline-block;width:9px;height:9px;margin-right:6px;border-radius:50%;background:var(--g)}.metric{margin-top:12px;font-size:28px;font-weight:bold}.muted{color:var(--m)}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 149</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 149</div><h1>AI agent status monitoring</h1><section class="grid"><article class="card"><h2><span class="dot"></span>Report agent</h2><div class="metric">Healthy</div><p class="muted">Last run 2 minutes ago</p></article><article class="card"><h2><span class="dot"></span>Support agent</h2><div class="metric">Healthy</div><p class="muted">Last run 5 minutes ago</p></article><article class="card"><h2><span class="dot"></span>Data agent</h2><div class="metric">Healthy</div><p class="muted">Last run 8 minutes ago</p></article></section></main></body></html>
