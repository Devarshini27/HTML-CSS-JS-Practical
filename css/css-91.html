<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 91 | Analytics Dashboard</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(1100px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}.card{padding:20px;border:1px solid var(--l);border-radius:10px;background:#fff}.wide{grid-column:span 2}.metric{font-size:27px;font-weight:bold}.muted{color:var(--m)}.chart{height:150px;display:flex;align-items:end;gap:8px;margin-top:20px}.bar{flex:1;height:var(--h);border-radius:4px 4px 0 0;background:#9eb8ff}.bar:nth-child(2n){background:var(--b)}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 91</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 91</div><h1>Analytics dashboard</h1><section class="grid"><article class="card"><span class="muted">Sessions</span><div class="metric">84.2k</div></article><article class="card"><span class="muted">Conversion</span><div class="metric">6.8%</div></article><article class="card"><span class="muted">Bounce rate</span><div class="metric">31%</div></article><article class="card wide"><h2>Traffic trend</h2><div class="chart"><span class="bar" style="--h:42%"></span><span class="bar" style="--h:60%"></span><span class="bar" style="--h:51%"></span><span class="bar" style="--h:78%"></span><span class="bar" style="--h:90%"></span></div></article></section></main></body></html>
