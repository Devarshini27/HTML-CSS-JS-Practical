<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 196 | Active Sessions</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a;--r:#c43f56}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(900px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.sessions{margin-top:28px;padding:10px;border:1px solid var(--l);border-radius:10px;background:#fff}.session{display:flex;justify-content:space-between;gap:15px;padding:16px;border-bottom:1px solid var(--l)}.session:last-child{border:0}.current{color:#168866;font-weight:bold}.revoke{border:1px solid var(--r);border-radius:6px;color:var(--r);background:#fff;font-weight:bold}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 196</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 196</div><h1>Active sessions and devices</h1><section class="sessions"><div class="session"><span><strong>MacBook Air</strong><br>Chrome · Bengaluru<br><span class="current">Current session</span></span><button class="revoke">Current</button></div><div class="session"><span><strong>iPhone 15</strong><br>Safari · Bengaluru<br>Last active 2 hours ago</span><button class="revoke">Revoke</button></div></section></main></body></html>
