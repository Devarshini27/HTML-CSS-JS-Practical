<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 268 | SaaS 404</title><style>:root{--n:#08295f;--b:#1257c7}*{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;margin:0;background:#f7faff;color:#17243b;font:14px Arial}.error{text-align:center}.code{font-size:clamp(90px,20vw,180px);line-height:.8;color:var(--b);font-weight:900}.button{display:inline-block;margin-top:18px;padding:11px 15px;border-radius:6px;color:#fff;background:var(--b);text-decoration:none;font-weight:bold}</style></head><body><main class="error"><div class="code">404</div><h1>Page not found</h1><p>The requested page does not exist.</p><a class="button" href="index.html">Return home</a></main></body></html>
