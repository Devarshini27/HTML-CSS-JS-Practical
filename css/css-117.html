<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 117 | AI Chat Interface</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(800px,calc(100% - 32px));margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.chat{margin-top:28px;padding:22px;border:1px solid var(--l);border-radius:10px;background:#fff}.message{display:flex;gap:10px;margin:15px 0}.avatar{display:grid;place-items:center;flex:0 0 32px;height:32px;border-radius:50%;color:#fff;background:var(--b);font-size:11px;font-weight:bold}.text{padding:12px;border-radius:8px;background:#eaf2ff}.user .text{color:#fff;background:var(--n)}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 117</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 117</div><h1>AI chat interface</h1><section class="chat"><div class="message"><span class="avatar">AI</span><div class="text">I found three changes in your activation rate.</div></div><div class="message user"><span class="avatar">DL</span><div class="text">Show me the largest change.</div></div><div class="message"><span class="avatar">AI</span><div class="text">Activation increased by 4.8% after the onboarding update.</div></div></section></main></body></html>
