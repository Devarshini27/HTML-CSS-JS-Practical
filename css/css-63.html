<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 63 | Dividers</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(800px,calc(100% - 32px));margin:auto;padding:80px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(40px,8vw,72px);line-height:.95}.section{margin-top:30px;padding:25px;border:1px solid var(--l);border-radius:12px;background:#fff}.divider{height:1px;margin:22px 0;background:var(--l)}.label{display:flex;align-items:center;gap:12px;color:var(--m)}.label:before,.label:after{content:"";height:1px;flex:1;background:var(--l)}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 63</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 63</div><h1>Dividers and section separators</h1><section class="section"><strong>Account overview</strong><div class="divider"></div><p>Content can be separated with a simple horizontal rule.</p><div class="label">OR</div><p>Labels can divide alternative actions.</p></section></main></body></html>
