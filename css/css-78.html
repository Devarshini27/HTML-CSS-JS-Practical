<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 78 | Progress Bar</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(800px,calc(100% - 32px));margin:auto;padding:80px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(40px,8vw,72px);line-height:.95}.progress{height:16px;margin-top:30px;border-radius:99px;background:#dce8ff;overflow:hidden}.value{width:68%;height:100%;border-radius:inherit;background:var(--b)}.meta{display:flex;justify-content:space-between;margin-top:8px;color:var(--m)}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 78</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 78</div><h1>Progress bar</h1><div class="progress"><div class="value"></div></div><div class="meta"><span>Processing report</span><strong>68%</strong></div></main></body></html>
