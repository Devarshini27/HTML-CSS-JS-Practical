<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 106 | Bar Chart</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(1050px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.card{margin-top:28px;padding:22px;border:1px solid var(--l);border-radius:10px;background:#fff}.bars{display:flex;align-items:end;gap:14px;height:230px;margin-top:20px}.bar{flex:1;height:var(--h);border-radius:5px 5px 0 0;background:var(--b);text-align:center}.bar span{position:relative;top:-20px;color:var(--m);font-size:12px}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 106</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 106</div><h1>Bar chart analytics</h1><section class="card"><h2>Tickets by team</h2><div class="bars"><div class="bar" style="--h:45%"><span>45</span></div><div class="bar" style="--h:68%"><span>68</span></div><div class="bar" style="--h:82%"><span>82</span></div><div class="bar" style="--h:57%"><span>57</span></div></div></section></main></body></html>
