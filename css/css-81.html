<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 81 | Login Form</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(460px,calc(100% - 32px));margin:auto;padding:80px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:42px}.form{padding:25px;border:1px solid var(--l);border-radius:12px;background:#fff}.form label{display:block;margin:13px 0 5px;font-weight:bold}.form input{width:100%;padding:11px;border:1px solid var(--l);border-radius:6px}.button{margin-top:18px;padding:11px 15px;border:0;border-radius:6px;color:#fff;background:var(--b);font-weight:bold}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 81</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 81</div><h1>Login form</h1><form class="form"><label for="email">Email</label><input id="email" type="email" required><label for="password">Password</label><input id="password" type="password" required><button class="button">Sign in</button></form></main></body></html>
