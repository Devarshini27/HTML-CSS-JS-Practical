<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 66 | Tooltip</title><style>:root{--n:#08295f;--b:#1257c7}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(800px,calc(100% - 32px));margin:auto;padding:80px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(40px,8vw,72px);line-height:.95}.tip{position:relative;display:inline-block;margin-top:35px;padding:14px 18px;border-radius:8px;color:#fff;background:var(--b);cursor:help}.tip span{position:absolute;bottom:calc(100% + 10px);left:50%;width:180px;padding:9px;border-radius:6px;color:#fff;background:#17243b;text-align:center;opacity:0;transform:translateX(-50%);transition:opacity .2s}.tip:hover span,.tip:focus span{opacity:1}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 66</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 66</div><h1>Tooltip component</h1><button class="tip">Hover or focus me<span>Helpful context appears here.</span></button></main></body></html>
