<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 116 | AI Assistant</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(800px,calc(100% - 32px));margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.assistant{margin-top:28px;padding:22px;border:1px solid var(--l);border-radius:10px;background:#fff}.bubble{max-width:75%;margin:12px 0;padding:13px;border-radius:9px;line-height:1.5}.ai{background:#eaf2ff}.user{margin-left:auto;color:#fff;background:var(--b)}.input{display:flex;gap:8px;margin-top:18px}.input input{flex:1;padding:11px;border:1px solid var(--l);border-radius:6px}.button{padding:11px 14px;border:0;border-radius:6px;color:#fff;background:var(--b)}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 116</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 116</div><h1>AI assistant interface</h1><section class="assistant"><div class="bubble ai">Hello. I can summarize metrics, explain trends, and help prepare a report.</div><div class="bubble user">Summarize this week’s activity.</div><div class="input"><input placeholder="Ask the assistant"><button class="button">Send</button></div></section></main></body></html>
