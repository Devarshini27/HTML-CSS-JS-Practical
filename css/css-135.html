<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 135 | Natural Language Query</title><style>:root{--n:#08295f;--b:#1257c7;--l:#d8e3f2;--m:#62718a}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:#17243b;font:14px Arial}.nav{padding:16px 6vw;color:#fff;background:linear-gradient(110deg,var(--n),var(--b))}.nav a{color:#fff;text-decoration:none}.page{width:min(850px,90%);margin:auto;padding:65px 0}.eyebrow{color:var(--b);font-weight:bold;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(38px,7vw,68px);line-height:.95}.query{display:flex;gap:8px;margin-top:28px}.query input{flex:1;padding:14px;border:1px solid var(--l);border-radius:7px;font:15px Arial}.query button{padding:12px 16px;border:0;border-radius:7px;color:#fff;background:var(--b);font-weight:bold}.example{margin-top:15px;color:var(--m)}</style></head><body><nav class="nav"><a href="index.html">DLA / CSS 135</a></nav><main class="page"><div class="eyebrow">CSS PROGRAM 135</div><h1>Natural-language query interface</h1><form class="query"><input value="Show revenue for the last six months"><button>Ask</button></form><p class="example">Ask questions in ordinary language instead of writing a query.</p></main></body></html>
