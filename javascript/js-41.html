<!DOCTYPE html>
<html>
<head>
    <title>JS 41 - Inheritance</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 60px;
        }

        h1 {
            color: #ffc107;
        }

        #output {
            color: #ffe082;
            font-size: 22px;
            line-height: 2;
        }
    </style>
</head>

<body>

    <h1>JavaScript Inheritance</h1>

    <div id="output"></div>

    <script>
        class Person {
            constructor(name) {
                this.name = name;
            }

            introduce() {
                return "My name is " + this.name;
            }
        }

        class Student extends Person {
            constructor(name, course) {
                super(name);
                this.course = course;
            }

            display() {
                return this.introduce() +
                       "<br>Course: " + this.course;
            }
        }

        let student = new Student("Devarshini", "B.Tech CSE");

        document.getElementById("output").innerHTML =
            student.display();
    </script>

</body>
</html>
