<!DOCTYPE html>
<html>
<head>
    <title>JS 16 - Arrow Functions</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        h1 {
            color: #ffc107;
        }

        input {
            padding: 12px;
            border-radius: 8px;
            border: none;
        }

        button {
            background: #ffc107;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            margin-left: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        #output {
            margin-top: 25px;
            color: #ffe082;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <h1>JavaScript Program 16</h1>
    <p>Demonstrate Arrow Functions</p>

    <input type="number" id="number" value="5">

    <button onclick="calculate()">Calculate Square</button>

    <div id="output"></div>

    <script>

        const square = (number) => number * number;

        function calculate() {

            let number =
                Number(document.getElementById("number").value);

            document.getElementById("output").innerHTML =
                "Square = " + square(number);
        }

    </script>

</body>
</html>
