<!DOCTYPE html>
<html>
<head>
    <title>JS 56 - Second Largest</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 60px;
        }

        h1 {
            color: #ffc107;
        }

        input {
            width: 300px;
            padding: 12px;
            border: none;
            border-radius: 8px;
        }

        button {
            background: #ffc107;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
        }

        #output {
            margin-top: 25px;
            color: #ffe082;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <h1>Second Largest Element</h1>

    <input type="text" id="array"
           placeholder="Enter numbers: 10, 20, 30, 40">

    <br>

    <button onclick="findSecondLargest()">Find</button>

    <div id="output"></div>

    <script>
        function findSecondLargest() {

            let array = document.getElementById("array").value
                .split(",")
                .map(Number);

            let unique = [...new Set(array)];

            unique.sort(function(a, b) {
                return b - a;
            });

            if (unique.length < 2) {
                document.getElementById("output").innerHTML =
                    "At least two different numbers are required.";
                return;
            }

            document.getElementById("output").innerHTML =
                "Second Largest = " + unique[1];
        }
    </script>

</body>
</html>
