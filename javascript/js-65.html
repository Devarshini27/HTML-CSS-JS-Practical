<!DOCTYPE html>
<html>
<head>
    <title>JS 65 - Character Frequency</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 60px;
        }

        h1 {
            color: #ffc107;
        }

        input {
            width: 300px;
            padding: 12px;
            border: none;
            border-radius: 8px;
        }

        button {
            background: #ffc107;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
        }

        #output {
            margin-top: 25px;
            color: #ffe082;
            font-size: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <h1>Frequency of Characters</h1>

    <input type="text" id="text"
           placeholder="Enter a string">

    <br>

    <button onclick="findFrequency()">Find Frequency</button>

    <div id="output"></div>

    <script>
        function findFrequency() {

            let text = document.getElementById("text").value;

            let frequency = {};

            for (let char of text) {

                if (char === " ") {
                    continue;
                }

                if (frequency[char]) {
                    frequency[char]++;
                } else {
                    frequency[char] = 1;
                }
            }

            let output = "";

            for (let char in frequency) {

                output += "'" + char + "' : " +
                          frequency[char] +
                          " time(s)<br>";
            }

            document.getElementById("output").innerHTML =
                output;
        }
    </script>

</body>
</html>
