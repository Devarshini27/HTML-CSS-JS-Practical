<!DOCTYPE html>
<html>
<head>
    <title>JS 62 - String Palindrome</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        h1 {
            color: #ffc107;
        }

        input {
            width: 300px;
            padding: 12px;
            border: none;
            border-radius: 8px;
        }

        button {
            background: #ffc107;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
        }

        #output {
            margin-top: 25px;
            color: #ffe082;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <h1>Check String Palindrome</h1>

    <input type="text" id="text" placeholder="Enter a string">

    <br>

    <button onclick="checkPalindrome()">Check</button>

    <div id="output"></div>

    <script>
        function checkPalindrome() {

            let text = document.getElementById("text").value
                .toLowerCase();

            let reversed = text.split("").reverse().join("");

            if (text === reversed) {
                document.getElementById("output").innerHTML =
                    "The string is a palindrome.";
            } else {
                document.getElementById("output").innerHTML =
                    "The string is not a palindrome.";
            }
        }
    </script>

</body>
</html>
