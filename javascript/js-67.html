<!DOCTYPE html>
<html>
<head>
    <title>JS 67 - Email Validation</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        h1 {
            color: #ffc107;
        }

        input {
            width: 300px;
            padding: 12px;
            border: none;
            border-radius: 8px;
        }

        button {
            background: #ffc107;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
        }

        #output {
            margin-top: 25px;
            color: #ffe082;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <h1>Validate Email Address</h1>

    <input type="text" id="email"
           placeholder="Enter your email">

    <br>

    <button onclick="validateEmail()">Validate</button>

    <div id="output"></div>

    <script>
        function validateEmail() {

            let email = document.getElementById("email").value;

            let pattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (pattern.test(email)) {

                document.getElementById("output").innerHTML =
                    "Valid email address.";

            } else {

                document.getElementById("output").innerHTML =
                    "Invalid email address.";

            }
        }
    </script>

</body>
</html>
