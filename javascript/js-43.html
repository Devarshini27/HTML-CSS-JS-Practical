<!DOCTYPE html>
<html>
<head>
    <title>JS 43 - Fetch API</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 60px;
        }

        h1 {
            color: #ffc107;
        }

        button {
            background: #ffc107;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        #output {
            color: #ffe082;
            font-size: 20px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <h1>Fetch Data From API</h1>

    <button onclick="getData()">Fetch Data</button>

    <div id="output"></div>

    <script>
        function getData() {

            fetch("https://jsonplaceholder.typicode.com/users/1")
                .then(response => response.json())
                .then(data => {

                    document.getElementById("output").innerHTML =
                        "Name: " + data.name +
                        "<br>Email: " + data.email;

                })
                .catch(error => {

                    document.getElementById("output").innerHTML =
                        "Error fetching data.";

                });
        }
    </script>

</body>
</html>
