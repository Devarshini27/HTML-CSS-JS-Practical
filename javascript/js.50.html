<!DOCTYPE html>
<html>
<head>
    <title>JS 50 - LCM</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        h1 {
            color: #ffc107;
        }

        input {
            padding: 12px;
            margin: 8px;
            border: none;
            border-radius: 8px;
        }

        button {
            background: #ffc107;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        #output {
            color: #ffe082;
            font-size: 22px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <h1>LCM of Two Numbers</h1>

    <input type="number" id="num1" placeholder="First number">

    <input type="number" id="num2" placeholder="Second number">

    <br>

    <button onclick="findLCM()">Find LCM</button>

    <div id="output"></div>

    <script>
        function findGCD(a, b) {

            while (b !== 0) {
                let temp = b;
                b = a % b;
                a = temp;
            }

            return Math.abs(a);
        }

        function findLCM() {

            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);

            if (a === 0 || b === 0) {
                document.getElementById("output").innerHTML =
                    "LCM = 0";
                return;
            }

            let gcd = findGCD(a, b);
            let lcm = Math.abs(a * b) / gcd;

            document.getElementById("output").innerHTML =
                "LCM = " + lcm;
        }
    </script>

</body>
</html>
