<!DOCTYPE html>
<html>
<head>
    <title>JS 48 - Swap Numbers</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        h1 {
            color: #ffc107;
        }

        input {
            padding: 12px;
            margin: 8px;
            border: none;
            border-radius: 8px;
        }

        button {
            background: #ffc107;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        #output {
            color: #ffe082;
            font-size: 22px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <h1>Swap Two Numbers</h1>

    <input type="number" id="num1" placeholder="First number">

    <input type="number" id="num2" placeholder="Second number">

    <br>

    <button onclick="swapNumbers()">Swap</button>

    <div id="output"></div>

    <script>
        function swapNumbers() {

            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);

            let temp = a;
            a = b;
            b = temp;

            document.getElementById("output").innerHTML =
                "After Swapping:<br>" +
                "First Number: " + a +
                "<br>Second Number: " + b;
        }
    </script>

</body>
</html>
