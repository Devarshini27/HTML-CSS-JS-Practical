<!DOCTYPE html>
<html>
<head>
    <title>JS 52 - Perfect Number</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        h1 {
            color: #ffc107;
        }

        input {
            padding: 12px;
            border: none;
            border-radius: 8px;
        }

        button {
            background: #ffc107;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
        }

        #output {
            margin-top: 25px;
            color: #ffe082;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <h1>Perfect Number</h1>

    <input type="number" id="number" placeholder="Enter a number">

    <br>

    <button onclick="checkPerfect()">Check</button>

    <div id="output"></div>

    <script>
        function checkPerfect() {

            let number = Number(document.getElementById("number").value);
            let sum = 0;

            for (let i = 1; i < number; i++) {

                if (number % i === 0) {
                    sum += i;
                }
            }

            if (sum === number && number > 0) {
                document.getElementById("output").innerHTML =
                    number + " is a perfect number.";
            } else {
                document.getElementById("output").innerHTML =
                    number + " is not a perfect number.";
            }
        }
    </script>

</body>
</html>
