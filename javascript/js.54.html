<!DOCTYPE html>
<html>
<head>
    <title>JS 54 - Power</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        h1 {
            color: #ffc107;
        }

        input {
            padding: 12px;
            margin: 8px;
            border: none;
            border-radius: 8px;
        }

        button {
            background: #ffc107;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        #output {
            margin-top: 25px;
            color: #ffe082;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <h1>Calculate Power</h1>

    <input type="number" id="base" placeholder="Base">

    <input type="number" id="exponent" placeholder="Exponent">

    <br>

    <button onclick="calculatePower()">Calculate</button>

    <div id="output"></div>

    <script>
        function calculatePower() {

            let base = Number(document.getElementById("base").value);
            let exponent = Number(document.getElementById("exponent").value);

            let result = Math.pow(base, exponent);

            document.getElementById("output").innerHTML =
                base + " ^ " + exponent + " = " + result;
        }
    </script>

</body>
</html>
