<!DOCTYPE html>
<html>
<head>
    <title>JS 23 - Background Color</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        h1 {
            color: #ffc107;
        }

        button {
            background: #ffc107;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>Change Background Color</h1>

    <button onclick="changeColor()">Change Color</button>

    <script>
        function changeColor() {
            document.body.style.background = "#243b55";
        }
    </script>

</body>
</html>
