<!DOCTYPE html>
<html>
<head>
    <title>JS 27 - Digital Clock</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        h1 {
            color: #ffc107;
        }

        #clock {
            font-size: 50px;
            color: #ffe082;
            margin-top: 30px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Digital Clock</h1>

    <div id="clock"></div>

    <script>
        function showTime() {
            let now = new Date();

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            hours = hours.toString().padStart(2, "0");
            minutes = minutes.toString().padStart(2, "0");
            seconds = seconds.toString().padStart(2, "0");

            document.getElementById("clock").innerHTML =
                hours + ":" + minutes + ":" + seconds;
        }

        setInterval(showTime, 1000);

        showTime();
    </script>

</body>
</html>
