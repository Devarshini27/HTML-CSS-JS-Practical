<!DOCTYPE html>
<html>
<head>
    <title>JS 15 - Functions</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        h1 {
            color: #ffc107;
        }

        input {
            padding: 12px;
            border-radius: 8px;
            border: none;
        }

        button {
            background: #ffc107;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            margin-left: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        #output {
            margin-top: 25px;
            color: #ffe082;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <h1>JavaScript Program 15</h1>
    <p>Demonstrate JavaScript Functions</p>

    <input type="text" id="name" placeholder="Enter your name">

    <button onclick="greetUser()">Call Function</button>

    <div id="output"></div>

    <script>

        function greet(name) {
            return "Hello, " + name + "!";
        }

        function greetUser() {

            let name = document.getElementById("name").value;

            document.getElementById("output").innerHTML =
                greet(name);
        }

    </script>

</body>
</html>
