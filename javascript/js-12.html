<!DOCTYPE html>
<html>
<head>
    <title>JS 12 - Array Largest Smallest</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        h1 {
            color: #ffc107;
        }

        input {
            width: 350px;
            padding: 12px;
            border-radius: 8px;
            border: none;
        }

        button {
            background: #ffc107;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            margin-left: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        #output {
            margin-top: 25px;
            color: #ffe082;
            font-size: 20px;
            line-height: 2;
        }
    </style>
</head>

<body>

    <h1>JavaScript Program 12</h1>
    <p>Find Largest and Smallest Element in an Array</p>

    <input
        type="text"
        id="array"
        value="10, 25, 5, 40, 15"
        placeholder="Enter numbers separated by commas"
    >

    <button onclick="findValues()">Find</button>

    <div id="output"></div>

    <script>
        function findValues() {

            let array = document.getElementById("array")
                .value
                .split(",")
                .map(Number);

            let largest = Math.max(...array);
            let smallest = Math.min(...array);

            document.getElementById("output").innerHTML =
                "Largest = " + largest + "<br>" +
                "Smallest = " + smallest;
        }
    </script>

</body>
</html>
