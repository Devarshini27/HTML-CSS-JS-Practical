<!DOCTYPE html>
<html>
<head>
    <title>JS 17 - String Methods</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        h1 {
            color: #ffc107;
        }

        input {
            width: 350px;
            padding: 12px;
            border-radius: 8px;
            border: none;
        }

        button {
            background: #ffc107;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            margin-left: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        #output {
            margin-top: 25px;
            color: #ffe082;
            font-size: 18px;
            line-height: 2;
        }
    </style>
</head>

<body>

    <h1>JavaScript Program 17</h1>
    <p>Demonstrate String Methods</p>

    <input
        type="text"
        id="text"
        value="JavaScript Programming"
    >

    <button onclick="showMethods()">Run</button>

    <div id="output"></div>

    <script>

        function showMethods() {

            let text = document.getElementById("text").value;

            document.getElementById("output").innerHTML =
                "Length = " + text.length + "<br>" +
                "Uppercase = " + text.toUpperCase() + "<br>" +
                "Lowercase = " + text.toLowerCase() + "<br>" +
                "First Character = " + text.charAt(0);
        }

    </script>

</body>
</html>
