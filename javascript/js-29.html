<!DOCTYPE html>
<html>
<head>
    <title>JS 29 - Guessing Game</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        h1 {
            color: #ffc107;
        }

        input {
            padding: 12px;
            border-radius: 8px;
            border: none;
        }

        button {
            background: #ffc107;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
        }

        #result {
            margin-top: 25px;
            color: #ffe082;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <h1>Number Guessing Game</h1>

    <p>Guess a number between 1 and 10.</p>

    <input type="number" id="guess" placeholder="Enter your guess">

    <button onclick="checkGuess()">Guess</button>

    <div id="result"></div>

    <script>
        let randomNumber = Math.floor(Math.random() * 10) + 1;

        function checkGuess() {

            let guess = Number(document.getElementById("guess").value);

            if (guess === randomNumber) {
                document.getElementById("result").innerHTML =
                    "🎉 Correct! You guessed the number!";
            }
            else if (guess < randomNumber) {
                document.getElementById("result").innerHTML =
                    "Too low! Try again.";
            }
            else {
                document.getElementById("result").innerHTML =
                    "Too high! Try again.";
            }
        }
    </script>

</body>
</html>
