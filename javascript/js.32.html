<!DOCTYPE html>
<html>
<head>
    <title>JS 32 - To-Do List</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #ffc107;
        }

        input {
            padding: 12px;
            width: 250px;
            border: none;
            border-radius: 8px;
        }

        button {
            background: #ffc107;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin: 12px auto;
            padding: 12px;
            width: 350px;
            background: #102a47;
            border-radius: 8px;
            color: #ffe082;
        }
    </style>
</head>

<body>

    <h1>To-Do List</h1>

    <input type="text" id="task" placeholder="Enter a task">

    <button onclick="addTask()">Add Task</button>

    <ul id="taskList"></ul>

    <script>
        function addTask() {

            let task = document.getElementById("task").value;

            if (task === "") {
                alert("Please enter a task.");
                return;
            }

            let li = document.createElement("li");

            li.innerHTML = task +
                ' <button onclick="this.parentElement.remove()">Delete</button>';

            document.getElementById("taskList").appendChild(li);

            document.getElementById("task").value = "";
        }
    </script>

</body>
</html>
