<!DOCTYPE html>
<html>
<head>
    <title>JS 34 - Counter</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        h1 {
            color: #ffc107;
        }

        #count {
            font-size: 60px;
            color: #ffe082;
            margin: 30px;
        }

        button {
            background: #ffc107;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>Counter</h1>

    <div id="count">0</div>

    <button onclick="decrease()">−</button>
    <button onclick="increase()">+</button>

    <script>
        let count = 0;

        function increase() {
            count++;
            document.getElementById("count").innerHTML = count;
        }

        function decrease() {
            count--;
            document.getElementById("count").innerHTML = count;
        }
    </script>

</body>
</html>
