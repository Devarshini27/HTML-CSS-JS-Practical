<!DOCTYPE html>
<html>
<head>
    <title>JS 37 - Advanced JavaScript</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 60px;
        }

        h1 {
            color: #ffc107;
        }

        #output {
            color: #ffe082;
            font-size: 20px;
            line-height: 2;
        }
    </style>
</head>

<body>

    <h1>Advanced JavaScript Lab</h1>

    <div id="output"></div>

    <script>
        let name = "Devarshini";
        const age = 18;

        let message = `Hello ${name}, you are ${age} years old.`;

        document.getElementById("output").innerHTML =
            message;
    </script>

</body>
</html>
