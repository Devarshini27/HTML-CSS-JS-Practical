<!DOCTYPE html>
<html>
<head>
    <title>JS 64 - Count Words</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        h1 {
            color: #ffc107;
        }

        input {
            width: 400px;
            padding: 12px;
            border: none;
            border-radius: 8px;
        }

        button {
            background: #ffc107;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
        }

        #output {
            margin-top: 25px;
            color: #ffe082;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <h1>Count Words in a String</h1>

    <input type="text" id="text"
           placeholder="Enter a sentence">

    <br>

    <button onclick="countWords()">Count Words</button>

    <div id="output"></div>

    <script>
        function countWords() {

            let text = document.getElementById("text").value.trim();

            if (text === "") {
                document.getElementById("output").innerHTML =
                    "Number of words: 0";
                return;
            }

            let words = text.split(/\s+/);

            document.getElementById("output").innerHTML =
                "Number of words: " + words.length;
        }
    </script>

</body>
</html>
