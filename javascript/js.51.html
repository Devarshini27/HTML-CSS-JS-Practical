<!DOCTYPE html>
<html>
<head>
    <title>JS 51 - Armstrong Number</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        h1 {
            color: #ffc107;
        }

        input {
            padding: 12px;
            border: none;
            border-radius: 8px;
        }

        button {
            background: #ffc107;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
        }

        #output {
            margin-top: 25px;
            color: #ffe082;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <h1>Armstrong Number</h1>

    <input type="number" id="number" placeholder="Enter a number">

    <br>

    <button onclick="checkArmstrong()">Check</button>

    <div id="output"></div>

    <script>
        function checkArmstrong() {

            let number = Number(document.getElementById("number").value);

            let original = number;
            let digits = String(number).length;
            let sum = 0;

            while (number > 0) {
                let digit = number % 10;
                sum += Math.pow(digit, digits);
                number = Math.floor(number / 10);
            }

            if (sum === original) {
                document.getElementById("output").innerHTML =
                    original + " is an Armstrong number.";
            } else {
                document.getElementById("output").innerHTML =
                    original + " is not an Armstrong number.";
            }
        }
    </script>

</body>
</html>
