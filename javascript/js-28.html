<!DOCTYPE html>
<html>
<head>
    <title>JS 28 - Calculator</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 60px;
        }

        h1 {
            color: #ffc107;
        }

        input {
            padding: 12px;
            margin: 8px;
            border-radius: 8px;
            border: none;
            width: 150px;
        }

        button {
            background: #ffc107;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }

        #result {
            margin-top: 25px;
            color: #ffe082;
            font-size: 24px;
        }
    </style>
</head>

<body>

    <h1>Simple Calculator</h1>

    <input type="number" id="num1" placeholder="First number">
    <input type="number" id="num2" placeholder="Second number">

    <br>

    <button onclick="calculate('+')">+</button>
    <button onclick="calculate('-')">−</button>
    <button onclick="calculate('*')">×</button>
    <button onclick="calculate('/')">÷</button>

    <div id="result"></div>

    <script>
        function calculate(operator) {

            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);
            let result;

            if (operator === "+") {
                result = num1 + num2;
            }
            else if (operator === "-") {
                result = num1 - num2;
            }
            else if (operator === "*") {
                result = num1 * num2;
            }
            else if (operator === "/") {
                if (num2 === 0) {
                    result = "Cannot divide by zero";
                } else {
                    result = num1 / num2;
                }
            }

            document.getElementById("result").innerHTML =
                "Result: " + result;
        }
    </script>

</body>
</html>
