<!DOCTYPE html>
<html>
<head>
    <title>JS 21 - DOM & Events</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        h1 {
            color: #ffc107;
        }

        button {
            background: #ffc107;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
        }

        #output {
            margin-top: 25px;
            color: #ffe082;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <h1>DOM & Event-Based Experiments</h1>

    <p id="message">Click a button to interact with the webpage.</p>

    <button onclick="changeText()">Change Text</button>
    <button onclick="changeColor()">Change Color</button>
    <button onclick="showMessage()">Show Message</button>

    <div id="output"></div>

    <script>
        function changeText() {
            document.getElementById("message").innerHTML =
                "The text has been changed using JavaScript!";
        }

        function changeColor() {
            document.getElementById("message").style.color = "#ffc107";
        }

        function showMessage() {
            document.getElementById("output").innerHTML =
                "Button click event executed successfully!";
        }
    </script>

</body>
</html>
