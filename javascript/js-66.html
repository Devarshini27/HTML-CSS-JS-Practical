<!DOCTYPE html>
<html>
<head>
    <title>JS 66 - Regular Expressions</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 60px;
        }

        h1 {
            color: #ffc107;
        }

        input {
            width: 300px;
            padding: 12px;
            border: none;
            border-radius: 8px;
        }

        button {
            background: #ffc107;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
        }

        #output {
            margin-top: 25px;
            color: #ffe082;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <h1>Regular Expressions</h1>

    <input type="text" id="text"
           placeholder="Enter text">

    <br>

    <button onclick="testRegex()">Test</button>

    <div id="output"></div>

    <script>
        function testRegex() {

            let text = document.getElementById("text").value;

            // Regular expression to check
            // whether the text contains only digits
            let pattern = /^[0-9]+$/;

            if (pattern.test(text)) {
                document.getElementById("output").innerHTML =
                    "The text contains only numbers.";
            } else {
                document.getElementById("output").innerHTML =
                    "The text contains characters other than numbers.";
            }
        }
    </script>

</body>
</html>
