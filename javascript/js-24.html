<!DOCTYPE html>
<html>
<head>
    <title>JS 24 - Button Click Event</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        h1 {
            color: #ffc107;
        }

        button {
            background: #ffc107;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        #output {
            margin-top: 25px;
            color: #ffe082;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <h1>Button Click Event</h1>

    <button onclick="buttonClicked()">Click Me</button>

    <div id="output"></div>

    <script>
        function buttonClicked() {
            document.getElementById("output").innerHTML =
                "Button was clicked!";
        }
    </script>

</body>
</html>
