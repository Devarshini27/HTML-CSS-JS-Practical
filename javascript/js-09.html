<!DOCTYPE html>
<html>
<head>
    <title>JS 09 - Palindrome</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        h1 {
            color: #ffc107;
        }

        input {
            padding: 12px;
            border-radius: 8px;
            border: none;
        }

        button {
            background: #ffc107;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            margin-left: 10px;
            font-weight: bold;
        }

        #output {
            margin-top: 25px;
            color: #ffe082;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <h1>JavaScript Program 09</h1>
    <p>Check Whether a Number is a Palindrome</p>

    <input type="number" id="number" placeholder="Enter number">

    <button onclick="checkPalindrome()">Check</button>

    <div id="output"></div>

    <script>
        function checkPalindrome() {

            let number = document.getElementById("number").value;

            let reverse = number
                .split("")
                .reverse()
                .join("");

            if (number === reverse) {
                document.getElementById("output").innerHTML =
                    number + " is a Palindrome";
            } else {
                document.getElementById("output").innerHTML =
                    number + " is not a Palindrome";
            }
        }
    </script>

</body>
</html>
