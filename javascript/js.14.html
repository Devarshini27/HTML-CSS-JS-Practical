<!DOCTYPE html>
<html>
<head>
    <title>JS 14 - Sum and Average</title>

    <style>
        body {
            background: #071a32;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        h1 {
            color: #ffc107;
        }

        input {
            width: 350px;
            padding: 12px;
            border-radius: 8px;
            border: none;
        }

        button {
            background: #ffc107;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            margin-left: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        #output {
            margin-top: 25px;
            color: #ffe082;
            font-size: 20px;
            line-height: 2;
        }
    </style>
</head>

<body>

    <h1>JavaScript Program 14</h1>
    <p>Find Sum and Average of Array Elements</p>

    <input
        type="text"
        id="array"
        value="10, 20, 30, 40, 50"
    >

    <button onclick="calculate()">Calculate</button>

    <div id="output"></div>

    <script>
        function calculate() {

            let array = document.getElementById("array")
                .value
                .split(",")
                .map(Number);

            let sum = 0;

            for (let i = 0; i < array.length; i++) {
                sum = sum + array[i];
            }

            let average = sum / array.length;

            document.getElementById("output").innerHTML =
                "Sum = " + sum + "<br>" +
                "Average = " + average;
        }
    </script>

</body>
</html>
